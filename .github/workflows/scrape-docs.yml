name: Scrape docs to Meilisearch

on:
  # Triggered by Netlify Build Plugin (plugins/trigger-scrape) after successful deploy
  # client_payload: { context, start_url, index_uid }
  repository_dispatch:
    types: [scrape-docs]
  # Manual fallback trigger (uses production defaults)
  workflow_dispatch:
    inputs:
      index_uid:
        description: 'Meilisearch index UID'
        default: 'docs'
      start_url:
        description: 'URL to start scraping from'
        default: 'https://docs.kvid.ai/'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve scrape parameters
        id: params
        run: |
          INDEX_UID="${{ github.event.client_payload.index_uid || github.event.inputs.index_uid || 'docs' }}"
          START_URL="${{ github.event.client_payload.start_url || github.event.inputs.start_url || 'https://docs.kvid.ai/' }}"
          CONTEXT="${{ github.event.client_payload.context || 'production' }}"
          echo "index_uid=$INDEX_UID" >> $GITHUB_OUTPUT
          echo "start_url=$START_URL" >> $GITHUB_OUTPUT
          echo "context=$CONTEXT" >> $GITHUB_OUTPUT
          echo "Scraping: context=$CONTEXT index=$INDEX_UID url=$START_URL"

      - name: Generate scraper config
        run: |
          python3 - <<'EOF'
          import json

          with open('.meilisearch-docs-scraper.json') as f:
              config = json.load(f)

          config['index_uid'] = '${{ steps.params.outputs.index_uid }}'
          config['start_urls'] = ['${{ steps.params.outputs.start_url }}']

          # Use sitemap only for production (preview URLs have isolated sitemaps)
          if '${{ steps.params.outputs.context }}' == 'production':
              config['sitemap_urls'] = ['https://docs.kvid.ai/sitemap.xml']
          else:
              config.pop('sitemap_urls', None)

          with open('/tmp/scraper-config.json', 'w') as f:
              json.dump(config, f, indent=2)

          print(f"Config: index={config['index_uid']} start={config['start_urls']}")
          EOF

      - name: Run docs-scraper
        env:
          MEILISEARCH_HOST_URL: ${{ secrets.MEILISEARCH_HOST_URL }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_ADMIN_API_KEY }}
        run: |
          docker run -t --rm \
            -e MEILISEARCH_HOST_URL \
            -e MEILISEARCH_API_KEY \
            -v "/tmp/scraper-config.json:/docs-scraper/config.json" \
            getmeili/docs-scraper:latest \
            pipenv run ./docs_scraper config.json

      - name: Add lang field to indexed documents
        env:
          MEILISEARCH_HOST_URL: ${{ secrets.MEILISEARCH_HOST_URL }}
          MEILISEARCH_API_KEY: ${{ secrets.MEILISEARCH_ADMIN_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request

          host = os.environ['MEILISEARCH_HOST_URL'].rstrip('/')
          key = os.environ['MEILISEARCH_API_KEY']
          index_uid = '${{ steps.params.outputs.index_uid }}'

          def api(method, path, data=None):
              req = urllib.request.Request(f"{host}{path}", method=method,
                  headers={'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'})
              if data is not None:
                  req.data = json.dumps(data).encode()
              with urllib.request.urlopen(req) as r:
                  return json.load(r)

          # Paginate through all documents and collect lang patches
          offset, limit, patches = 0, 500, []
          resp = api('GET', f'/indexes/{index_uid}/documents?limit=1&fields=objectID')
          total = resp['total']
          print(f'Total documents: {total}')

          while offset < total:
              resp = api('GET', f'/indexes/{index_uid}/documents?limit={limit}&offset={offset}&fields=objectID,url')
              for doc in resp['results']:
                  lang = 'ko' if '/ko/' in doc.get('url', '') else 'en'
                  patches.append({'objectID': doc['objectID'], 'lang': lang})
              offset += limit

          # Patch in batches (partial update — preserves all other fields)
          for i in range(0, len(patches), 500):
              batch = patches[i:i+500]
              resp = api('POST', f'/indexes/{index_uid}/documents?primaryKey=objectID', batch)
              print(f'Patch batch {i//500+1}/{-(-len(patches)//500)}: taskUid={resp.get("taskUid")}')

          ko = sum(1 for p in patches if p['lang'] == 'ko')
          print(f'lang applied — en: {len(patches)-ko}, ko: {ko}')
          EOF
